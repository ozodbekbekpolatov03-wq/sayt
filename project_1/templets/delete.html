<div class="container mt-5">
    <div class="card border-danger mx-auto" style="max-width: 500px;">
        <div class="card-body text-center">
            <h3 class="text-danger">O'chirishni tasdiqlaysizmi?</h3>
            <p>"{{ object.title }}" yangiligi butunlay o'chib ketadi!</p>
            <form method="post">{% csrf_token %}
                <button type="submit" class="btn btn-danger">Ha, o'chirilsin</button>
                <a href="{% url 'new' %}" class="btn btn-secondary">Bekor qilish</a>
            </form>
        </div>
    </div>
</div>
