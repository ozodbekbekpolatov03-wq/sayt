<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #333; font-family: sans-serif; }
        .header { border-bottom: 2px solid #000; padding: 20px 0; margin-bottom: 30px; }
        .news-item { border-bottom: 1px solid #eee; padding: 20px 0; }
        .news-title { font-weight: bold; color: #000; text-decoration: none; font-size: 20px; }
        .news-title:hover { color: #004a99; }
        .news-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 4px; }
        .btn-add { background: #000; color: #fff; border: none; padding: 8px 15px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Tepasi (Logo va Tugma) -->
    <div class="header d-flex justify-content-between align-items-center">
        <h1 class="m-0 fw-bold">YANGILIKLAR</h1>
        {% if user.is_authenticated %}
            <a href="{% url 'create' %}" class="btn-add">+ Qo'shish</a>
        {% else %}
            <a href="/admin" class="text-dark text-decoration-none">Kirish</a>
        {% endif %}
    </div>

    <!-- Yangiliklar ro'yxati -->
    <div class="row">
        {% for new in object_list %}
        <div class="col-12 news-item">
            <div class="row align-items-center">
                <div class="col-md-3">
                    {% if new.img %}
                        <img src="{{ new.img.url }}" class="news-img" alt="img">
                    {% else %}
                        <div class="bg-light text-center py-5">Rasm yo'q</div>
                    {% endif %}
                </div>
                <div class="col-md-9">
                    <a href="{% url 'detail' new.pk %}" class="news-title d-block mb-2">
                        {{ new.title }}
                    </a>
                    <p class="text-muted">{{ new.body|truncatewords:20 }}</p>
                    <!-- <small class="text-secondary">Bugun, 12:00</small> -->
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
